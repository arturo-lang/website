# /usr/local/etc/nginx/vhosts/arturo-lang.io.conf

######################################
## Installer script redirects
######################################

# Installer HTTP redirect
server {
    listen 80;
    server_name get.arturo-lang.io;
    return 301 https://get.arturo-lang.io$request_uri;
}

# Installer HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    server_name get.arturo-lang.io;
    
    # SSL configuration
    ssl_certificate /usr/local/etc/letsencrypt/live/arturo-lang.io/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/arturo-lang.io/privkey.pem;
    
    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers - defined once at server level
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    root /usr/local/www/arturo/main/versions;
        
    # Exact match for root - stable installer.sh
    location = / {
        default_type text/plain;
        try_files /stable/scripts/installer.sh =404;
    }
    
    # Exact match for /ps - stable installer.ps1
    location = /ps {
        default_type text/plain;
        try_files /stable/scripts/installer.ps1 =404;
    }
    
    # Exact match for /latest - latest installer.sh
    location = /latest {
        default_type text/plain;
        try_files /latest/scripts/installer.sh =404;
    }
    
    # Exact match for /latest/ps - latest installer.ps1
    location = /latest/ps {
        default_type text/plain;
        try_files /latest/scripts/installer.ps1 =404;
    }
}

######################################
## Main domain redirects & config
######################################

# WWW redirect (HTTP)
server {
    listen 80;
    server_name www.arturo-lang.io;
    return 301 https://arturo-lang.io$request_uri;
}

# WWW redirect (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    server_name www.arturo-lang.io;
    
    # SSL configuration (same certs work for both)
    ssl_certificate /usr/local/etc/letsencrypt/live/arturo-lang.io/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/arturo-lang.io/privkey.pem;
    
    return 301 https://arturo-lang.io$request_uri;
}

# Redirect HTTP to HTTPS
server {
    listen 80 default_server;
    server_name arturo-lang.io;
    
    return 301 https://arturo-lang.io$request_uri;
}

# HTTPS server
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    server_name arturo-lang.io;
    
    # SSL configuration
    ssl_certificate /usr/local/etc/letsencrypt/live/arturo-lang.io/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/arturo-lang.io/privkey.pem;
    
    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers - defined once at server level
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    root /usr/local/www/arturo/main/versions/stable;
    index index.html;
    
    ######################################
    ## GitHub proxy for /latest/ binaries
    ######################################
    
    location ~ ^/latest/files/(.+\.zip)$ {
        set $filename $1;
        
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        proxy_pass https://github.com/arturo-lang/nightly/releases/latest/download/$filename;
        proxy_intercept_errors on;
        error_page 301 302 307 = @handle_github_redirect;
        error_page 502 503 504 = @serve_local;
    }
    
    location @handle_github_redirect {
        set $saved_redirect_location '$upstream_http_location';
        resolver 8.8.8.8 8.8.4.4;
        
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        proxy_pass $saved_redirect_location;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @serve_local;
    }
    
    location @serve_local {
        if ($uri ~ ^/latest/files/(.+)$) {
            set $filename $1;
        }
        
        root /usr/local/www/arturo/main/versions;
        
        # Need to redefine headers in location blocks that use add_header
        add_header X-Served-By "Local-Fallback" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        try_files /latest/files/$filename =404;
    }

    ######################################
    ## PHP & Playground
    ######################################
    
    # (1) PHP for Versioned paths
    location ~ ^/(latest|test|v[0-9.]+)/.*\.php$ {
        root /usr/local/www/arturo/main/versions;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # (2) PHP for stable release paths
    location ~ \.php$ {
        root /usr/local/www/arturo/main/versions/stable;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Playground for versioned paths
    location ~ ^/(latest|test|v[0-9.]+)/playground/([a-zA-Z0-9]+)$ {
        root /usr/local/www/arturo/main/versions;
        try_files /$1/playground/index.html =404;
    }

    # Playground for stable paths
    location ~ ^/playground/([a-zA-Z0-9]+)$ {
        root /usr/local/www/arturo/main/versions;
        try_files /stable/playground/index.html =404;
    }
     
    ######################################
    ## Version paths
    ######################################
    
    # Remove ALL trailing slashes from version paths
    location ~ ^/(latest|stable|test|v[0-9.]+)(/.*)?/$ {
        rewrite ^(.*)/$ $1 permanent;
    }

    # HTTP Basic Auth for /test (and everything below it)
    location ~ ^/test(/|$) {
        auth_basic "Test Version - Restricted Access";
        auth_basic_user_file /usr/local/etc/nginx/.htpasswd;
        
        root /usr/local/www/arturo/main/versions;
        error_page 404 /test/error/404/index.html;
        try_files $uri $uri/index.html =404;
    }

    # Serve version paths (no trailing slash redirects)
    location ~ ^/(latest|stable|test|v[0-9.]+)(/|$) {
        root /usr/local/www/arturo/main/versions;
        error_page 404 /$1/error/404/index.html;
        try_files $uri $uri/index.html =404;
    }
    
    location ~ ^/([^/]+)/error/404/index\.html$ {
        root /usr/local/www/arturo/main/versions;
        internal;
    }
    
    ######################################
    ## Static assets caching
    ######################################
    
    location ~* \.(jpg|jpeg|png|webp|gif|ico)$ {
        expires 30d;
    }
    
    location ~* \.(css|js)$ {
        expires 7d;
    }
    
    ######################################
    ## Default handler
    ######################################
    
    location / {
        try_files $uri $uri/index.html =404;
    }
}